version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fabriccash_db
    environment:
      POSTGRES_USER: fabriccash_user
      POSTGRES_PASSWORD: fabriccash_password
      POSTGRES_DB: fabriccash_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fabriccash_user -d fabriccash_dev']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
